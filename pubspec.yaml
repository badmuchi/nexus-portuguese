name: nexus_portuguese_app
description: Offline-first Portuguese learning application built with DDD, Clean Architecture and hybrid PT-BR/PT-PT support.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.2
  drift: ^2.24.0
  drift_flutter: ^0.3.0
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^10.2.0
  flutter_tts: ^4.2.5
  just_audio: ^0.10.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.24.0
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/seed/dialogues_seed.json
    - assets/seed/dictionary_seed.json
    - assets/seed/grammar_verbs_seed.json
    - assets/seed/listening_seed.json
    - assets/seed/srs_seed.json
    - assets/seed/stories_seed.json
    - assets/seed/slang_seed.json
    - assets/seed/phonetics_seed.json
    - assets/audio/
